name: CI and deployment

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shortlist-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Source and deployment checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check JavaScript and JSON
        run: |
          node --check public/main.js
          node --check scripts/build.mjs
          node --check scripts/serve.mjs
          node --check tests/browser.mjs
          python3 -m json.tool data/sources.json >/dev/null
          python3 -m json.tool package-lock.json >/dev/null
          git diff --check
      - name: Test release validation and rollback
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Explain fork check scope
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo 'Fork pull requests receive source and deployment checks. Full browser checks need the private company stylesheet and run on a maintainer-owned branch or after merge, before deployment.' >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build and browser checks
    needs: validate
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact-id: ${{ steps.site.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install locked dependencies with read-only style access
        env:
          STYLE_DEPLOY_KEY: ${{ secrets.STYLE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          test -n "$STYLE_DEPLOY_KEY"
          key_dir="$(mktemp -d "$RUNNER_TEMP/shortlist-style.XXXXXX")"
          trap 'rm -rf "$key_dir"' EXIT
          chmod 700 "$key_dir"
          printf '%s\n' "$STYLE_DEPLOY_KEY" > "$key_dir/key"
          chmod 600 "$key_dir/key"
          export GIT_SSH_COMMAND="ssh -i $key_dir/key -o IdentitiesOnly=yes -o IdentityAgent=none -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$GITHUB_WORKSPACE/.github/known_hosts"
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate and build the static site
        run: npm run check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test responsive layout, accessibility and interactions
        run: npm run test:browser
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-evidence-${{ github.sha }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: Package the tested files
        run: |
          tar -C dist -czf site.tar.gz .
          sha256sum site.tar.gz > site.tar.gz.sha256
      - name: Save the deployable artifact
        id: site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-${{ github.sha }}
          path: |
            site.tar.gz
            site.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  deploy:
    name: Deploy production
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: production
      url: https://fundings.wiki/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: ${{ runner.temp }}/site
          merge-multiple: true
      - name: Check this commit is still current
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh api repos/Dobriy-AI/shortlist/git/ref/heads/main --jq .object.sha)"
          if [[ "$latest" == "$GITHUB_SHA" ]]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            echo 'A newer commit is on main. This deployment was skipped.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish and verify, restoring the previous release on failure
        if: steps.current.outputs.deploy == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY"
          cd "$RUNNER_TEMP/site"
          sha256sum --check site.tar.gz.sha256
          checksum="$(sha256sum site.tar.gz | cut -d ' ' -f 1)"
          key_dir="$(mktemp -d "$RUNNER_TEMP/shortlist-deploy.XXXXXX")"
          trap 'rm -rf "$key_dir"' EXIT
          chmod 700 "$key_dir"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key_dir/key"
          chmod 600 "$key_dir/key"
          ssh -T -i "$key_dir/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$GITHUB_WORKSPACE/.github/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            vanya@46.225.13.35 "deploy $GITHUB_SHA $checksum" < site.tar.gz
      - name: Verify from the GitHub runner
        if: steps.current.outputs.deploy == 'true'
        run: |
          python3 deploy/smoke.py "$GITHUB_SHA"
          echo "Deployed [$GITHUB_SHA](https://github.com/Dobriy-AI/shortlist/commit/$GITHUB_SHA) to https://fundings.wiki/" >> "$GITHUB_STEP_SUMMARY"
